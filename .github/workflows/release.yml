name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              version="$GITHUB_REF_NAME"
          else
              git fetch --force --tags
              latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
              version="$(bash src/next_version.sh "$latest")"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$version" -m "Release $version"
              git push origin "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself

      - name: Build versioned artifact
        run: bash build.sh "${{ steps.version.outputs.version }}"

      - name: Generate checksum
        working-directory: dist
        run: |
          version="${{ steps.version.outputs.version }}"
          sha256sum "onboarding-$version.run" > "onboarding-$version.run.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            dist/onboarding-*.run
            dist/onboarding-*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
